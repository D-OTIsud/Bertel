version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/bertel-tourism-ui'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - 'patch'
          - 'minor'
    versioning-strategy: increase-if-necessary

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types:
          - 'patch'
          - 'minor'
