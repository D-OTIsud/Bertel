name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'tools/thesaurus-content/**'
      - 'bertel-tourism-ui/src/app/api/public/**'
      - 'db-graph-out/graph.json'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/thesaurus-content/**'
      - 'bertel-tourism-ui/src/app/api/public/**'
      - 'db-graph-out/graph.json'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the partner guide and API contract
        run: node docs/partenaires-render.check.js
      - name: Check the complete static thesaurus guide
        run: node docs/thesaurus-render.check.js
      - name: Test offline thesaurus review and protected proposal tools
        run: node --test tools/thesaurus-content/*.test.mjs
      - name: Validate all governed domain translations and SQL mirrors
        run: node tools/thesaurus-content/validate-domain-labels.mjs
      - name: Check Postman route coverage and scripts without sending requests
        run: node docs/postman.check.js
      - name: Build the documentation image with its explicit public file list
        run: docker build --tag bertel-documentation-ci ./docs
