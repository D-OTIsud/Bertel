name: Frontend CI

on:
  push:
    paths:
      - 'bertel-tourism-ui/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'bertel-tourism-ui/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bertel-tourism-ui

env:
  # Explicit demo mode for CI builds/tests: no Supabase project credentials needed here.
  NEXT_PUBLIC_ENABLE_DEMO_MODE: 'true'

jobs:
  production-pdf-runtime:
    # The deployed image uses Alpine/musl; Ubuntu success alone does not prove
    # that its native canvas/Sharp packages and PDF assets are usable.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the actual production image without project credentials
        run: docker build --build-arg NEXT_PUBLIC_ENABLE_DEMO_MODE=true --tag bertel-pdf-runtime:ci .

      - name: Verify compiled PDF rendering in the non-root Alpine runtime
        shell: bash
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,source=$PWD/scripts/verify-menu-document-native.cjs,target=/tmp/verify-menu-document-native.cjs,readonly" \
            --entrypoint node bertel-pdf-runtime:ci \
            /tmp/verify-menu-document-native.cjs /app | tee "$RUNNER_TEMP/pdf-production-runtime.json"

      - name: Upload the production runtime verification
        uses: actions/upload-artifact@v4
        with:
          name: pdf-production-runtime
          path: ${{ runner.temp }}/pdf-production-runtime.json
          retention-days: 7

  build-and-test:
    # Playwright 1.60.0 provides Chromium for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bertel-tourism-ui/package-lock.json

      # --legacy-peer-deps mirrors the Dockerfile install: next@16 pins @swc/helpers to
      # 0.5.15 while @storybook/test-runner's optional @swc/core peer wants >=0.5.17.
      - run: npm ci --legacy-peer-deps

      - run: npm run typecheck

      - run: npm run test:run -- --ci --maxWorkers=2

      - run: npm run build

      - name: Verify compiled standalone PDF rendering without checkout dependency fallback
        run: node scripts/verify-menu-document-native.cjs .next/standalone

      - name: Install Playwright Chromium
        run: node scripts/run-playwright.mjs install --with-deps chromium

      - name: Critical e2e (Chromium, demo mode)
        run: npm run test:e2e -- --project=chromium --workers=2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: bertel-tourism-ui/playwright-report
          retention-days: 7
