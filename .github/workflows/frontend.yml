name: Frontend CI

on:
  push:
    paths:
      - 'bertel-tourism-ui/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'bertel-tourism-ui/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bertel-tourism-ui

env:
  # Explicit demo mode for CI builds/tests: no Supabase project credentials needed here.
  NEXT_PUBLIC_ENABLE_DEMO_MODE: 'true'

jobs:
  build-and-test:
    # Playwright 1.60.0 provides Chromium for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bertel-tourism-ui/package-lock.json

      # Keep the same explicit lockfile installation option as the Dockerfile.
      - run: npm ci --legacy-peer-deps

      - name: Attest and reproduce the MapLibre security backport
        run: |
          npm run verify:maplibre
          npm run test:maplibre-backport

      - name: Exercise the corrected build dependency APIs
        run: npm run test:tooling-dependencies

      - name: Exercise the pinned operator CLI and preserved PostCSS YAML loader
        run: npm run test:supabase-cli

      - run: npm run typecheck

      - run: npm run test:run -- --ci --maxWorkers=2

      - run: npm run build

      - name: Install Playwright Chromium
        run: node scripts/run-playwright.mjs install --with-deps chromium

      - name: Critical e2e (Chromium, demo mode)
        run: npm run test:e2e -- --project=chromium --workers=2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: bertel-tourism-ui/playwright-report
          retention-days: 7
