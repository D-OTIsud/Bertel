name: Release candidate archive

on:
  push:
    paths: ['tools/release-artifact/**', '.github/workflows/release-artifact.yml', 'bertel-tourism-ui/docker-compose*.yml']
  pull_request:
    paths: ['tools/release-artifact/**', '.github/workflows/release-artifact.yml', 'bertel-tourism-ui/docker-compose*.yml']
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Exact reviewed master SHA. A different workflow snapshot is refused.'
        required: true
        type: string
      manual_email_profile:
        description: 'Required runtime contract: hard-closed for the S2 bridge, protocol-v1 for the guarded new protocol. A wrong profile fails.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Receiver guards (isolated Linux, synthetic fixtures only)
        run: sudo -n "$(command -v python)" -I -m unittest discover -s tools/release-artifact -p 'test_receiver*.py' -v
      - name: Import and isolated smoke guards (synthetic Docker, real Node and Linux filesystem)
        run: sudo -n env NODE_BINARY="$(command -v node)" "$(command -v python)" -I -m unittest discover -s tools/release-artifact -p 'test_import_smoke.py' -v
      - run: node --test tools/release-artifact/candidate.test.mjs
      - name: Manual email qualification guards (synthetic fixtures; no Docker or external network)
        run: node --test tools/release-artifact/manual-email.test.mjs
      - name: Prebuilt Compose contract (config only, synthetic parameters)
        run: node --test tools/release-artifact/prebuilt-compose.test.mjs

  prepare-archive:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: guard-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      MANUAL_EMAIL_PROFILE: ${{ inputs.manual_email_profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable source and capture only the public runtime configuration
        run: node tools/release-artifact/candidate.mjs prepare
      - name: Build the reviewed non-demo image away from production
        run: node tools/release-artifact/candidate.mjs build
      - name: Check final native runtime and tooling copies
        shell: bash
        run: |
          set -euo pipefail
          image="bertel-candidate:${GITHUB_SHA}"
          docker run --rm --entrypoint node \
            -v "$PWD/bertel-tourism-ui/scripts/check-native-image-runtime.cjs:/app/check-native-image-runtime.cjs:ro" \
            "$image" check-native-image-runtime.cjs
          docker run --rm --entrypoint node \
            -v "$PWD/bertel-tourism-ui/scripts/check-tooling-runtime.cjs:/app/check-tooling-runtime.cjs:ro" \
            "$image" check-tooling-runtime.cjs /app
      - name: Private-loopback smoke with public parameters only, without a service credential
        run: node tools/release-artifact/candidate.mjs smoke
      - name: Check out the real ungated calibration source separately
        uses: actions/checkout@v4
        with:
          ref: '50805933d9489974690f9bb208b633cfb5440070'
          path: '.release-work/calibration-source'
          fetch-depth: 1
          persist-credentials: false
      - name: Qualify the same final image in four runtime modes and reject the real ungated calibration
        run: node tools/release-artifact/manual-email-runtime.mjs qualify
      - name: Upload separate manual email qualification proof (outside the historical two-file bundle)
        uses: actions/upload-artifact@v4
        with:
          name: bertel-manual-email-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-work/manual-email-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Export bounded image and source/checksum manifest
        run: node tools/release-artifact/candidate.mjs export
      - uses: actions/upload-artifact@v4
        with:
          name: bertel-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-work/artifact/bertel-${{ github.sha }}.docker.tar.gz
            .release-work/artifact/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
