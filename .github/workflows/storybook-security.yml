name: Storybook Security

on:
  push:
    paths:
      - 'bertel-tourism-ui/**'
      - '.github/workflows/storybook-security.yml'
  pull_request:
    paths:
      - 'bertel-tourism-ui/**'
      - '.github/workflows/storybook-security.yml'

permissions:
  contents: read

concurrency:
  group: storybook-security-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bertel-tourism-ui

env:
  NEXT_PUBLIC_ENABLE_DEMO_MODE: 'true'
  STORYBOOK_DISABLE_TELEMETRY: '1'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  channels-build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bertel-tourism-ui/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Typecheck the security browser harness
        run: node node_modules/typescript/bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --skipLibCheck --types node --esModuleInterop playwright.storybook.config.ts tests/storybook/security.spec.ts
      - name: Exercise the real installed channel transports
        run: npm run test:storybook-security
      - name: Exercise the real builder middleware, traversal refusal and memfs4
        run: npm run test:webpack-middleware
      - name: Build the complete existing static Storybook
        run: npm run build-storybook -- --disable-telemetry
      - name: Install Playwright Chromium
        run: node scripts/run-playwright.mjs install --with-deps chromium
      - name: Exercise the patched dev server and real browser messages without retries
        run: npm run test:storybook-runtime
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-security-traces
          path: bertel-tourism-ui/test-results
          retention-days: 7
